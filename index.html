const rawData = [
  {id:1, q:"1 理念を【   】化するべきだ。このままでは机上の空論にすぎない。*", opts:["特殊","普遍","具体","抽象"], a:2},
  {id:2, q:"2 あなたの意見は【 A 】的で意味がよくわからないので、【 B 】的な例を挙げて説明してください。*", opts:["A:普遍 B:具体","A:抽象 B:具体","A:特殊 B:普遍","A:具体 B:抽象"], a:1},
  {id:3, q:"3 科学は、法則の【   】性について語ることができるのである。*", opts:["特殊","普遍","具体","抽象"], a:1},
  {id:4, q:"4 彼女（ミロのヴィーナス）はその両腕を、自分の美しさのために、無意識的に隠してきた…このことは、僕に、【 A 】から【 B 】への巧まざる跳躍であるようにも思われる…*", opts:["A:特殊 B:普遍","A:具体 B:抽象","A:普遍 B:具体","A:抽象 B:特殊"], a:0},
  {id:5, q:"5 彼女はクラスメイトから【   】的な信頼を得ている。*", opts:["主観","絶対","客観","相対","主体"], a:1},

  {id:7, q:"6 人間はアリよりも「大きい」が、ゾウよりも「小さい」。「大きい」や「小さい」は【   】的なものである。*", opts:["主観","絶対","客観","相対","主体"], a:3},

  {id:9, q:"7 近代の人間は、【   】的な生を求めた。*", opts:["主観","絶対","客観","相対","主体"], a:4},
  {id:10, q:"8 できるだけ【 A 】を排し、【 B 】的な意見を述べてほしい。*", opts:["A:主観 B:客観","A:絶対 B:相対","A:客観 B:主観","A:主体 B:相対"], a:0},
  {id:11, q:"9 声には、【   】を超えて、人間の生理の最も奥深い層にまで、じかに届くような力がある。*", opts:["概念","感性","分節","理性"], a:0},
  {id:12, q:"10 つまり、考えるというのは【 A 】の仕事であり、恋するというのは【 B 】の仕事で、これは別のことなのです。*", opts:["A:理性 B:感性","A:感性 B:理性","A:概念 B:分節","A:分節 B:概念"], a:0},
  {id:13, q:"11 〈世界〉という【   】が生まれるためには、抽象思考が可能になっていなければならない。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:2},
  {id:14, q:"12 類型化が行われるのは、混沌としたものを【   】化し、表現するための手段であって、そのために類型化と同時に差異化も行う。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:0},
  {id:15, q:"12 ある社会に属する人々にとっての「世界」の姿は、その社会の言語が世界をどのように【   】化しているかということに強く規定されている。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:0},
  {id:16, q:"13 貴族階級の衣服はいわば権威と威信の【   】であって、細部にいたるまで厳密な規定があった。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:1},
  {id:17, q:"14 言葉の意味は、それが使われている【   】の中で理解していかなければならない。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:4},
  {id:18, q:"15 人間は両義的な動物であって、合理性を持つ反面、【   】の体系としての言葉に背を向け生きようとする。*", opts:["分節","記号","概念","ロゴス","コンテクスト"], a:3},
  {id:19, q:"16 【   】とは、一方ではわれわれを保護する母性的な環境として、また他方でわれわれを束縛する規範的な制度として、二重の絆で個人と社会とを結びつけいている文化的なシステムである。*", opts:["文字","国語","母語"], a:2},
  {id:20, q:"17 それは、学校教育で修得された書き言葉という、【   】とはまた別の言語である。*", opts:["文字","国語","母語"], a:2},
  {id:21, q:"18 私たち【   】文化の人間は、情報を把握したりその内容を理解するのに、何と視覚に多くを頼っているか、さらにいえば、時間の相で流れてゆくものを空間化して固定したがるか、…*", opts:["文字","国語","母語"], a:0},
  {id:22, q:"19 客観というのは、事実から記述をなすときの、科学者仲間の約束ごとに支えられて成立しているのであり、この約束ごとは後に【   】という名で呼ばれるようになるのだが…*", opts:["パラダイム","体系","幻想","先入観","イデオロギー"], a:0},
  {id:23, q:"20 祖先のつくった価値【   】を傷つけずに保存することで共同体は維持されるし、またそうする必要が古代から中世まで連綿として続いた。*", opts:["パラダイム","体系","幻想","先入観","イデオロギー"], a:1},
  {id:24, q:"21 例えば眼は見るし、耳は聞く。その他五感のそれぞれの働きを通して得た知覚を合わせて、人間は外界を【   】するというわけである。*", opts:["実証","認識","形而上","形而下","遠近法"], a:1},
  {id:25, q:"22 意識的にであろうと、無意識的にであろうと、われわれが言語によって記述を行うとき、そこには関心の【   】が働いており、記録に値する有意味な情報の取捨選択がなされているのである。*", opts:["実証","認識","形而上","形而下","遠近法"], a:4},
  {id:26, q:"23 貨幣についての真の考察は、それが【   】学的な奇妙さに満ち満ちた存在であることへの驚きから始まった。*", opts:["実証","認識","形而上","形而下","遠近法"], a:2},
  {id:27, q:"24 社会科学は、【   】の対象を扱う学問である。社会科学のこの【   】性、言い換えれば此岸性と世俗性は記憶しておいたほうがよい。*", opts:["実証","認識","形而上","形而下","遠近法"], a:3},
  {id:28, q:"25 しかし集団検診がはたしてほんとうに健康増進にむすびついているかは【   】されていない。*", opts:["実証","認識","形而上","形而下","遠近法"], a:0},
  {id:29, q:"26 科学技術のめざましい発達は、人間が自然を征服することを可能にするかのように思われたこともあったが、もちろんそれは【   】にすぎない。*", opts:["パラダイム","体系","幻想","イデオロギー","先入観"], a:2},
  {id:30, q:"27 80年代、90年代の市場競争原理の徹底は、個人の自由の拡張という【   】や価値と深く関わっていた。*", opts:["パラダイム","体系","幻想","イデオロギー","先入観"], a:3},
  {id:31, q:"28 一つ一つの事件について、まったく【   】なしに判断をまとめるということは、ふつうの人にはまずできない。*", opts:["パラダイム","体系","幻想","イデオロギー","先入観"], a:4},
  {id:32, q:"29,30 今や【 A 】の仕事を一旦休み、【 B 】の力にもう一度立ち返ってみるべきではないだろうか。*", opts:["A:分析 B:総合","A:総合 B:分析","A:テクノロジー B:カテゴリー","A:カテゴリー B:テクノロジー"], a:0},
  {id:33, q:"31 最近のポピュラー音楽はその【   】の多様さにも拘わらず、どれも均質化したものとして聴こえる。*", opts:["総合","分析","テクノロジー","カテゴリー"], a:3},
  {id:34, q:"32 現代【   】に支えられた事業を指導者が強行するところでは、逆にテクノロジーの要請が、伝統社会の固い連関を暴力的に破壊する。*", opts:["総合","分析","テクノロジー","カテゴリー"], a:2},
  {id:35, q:"33 じぶんがだれかということ、つまりはひとの【   】というのは、じぶんがじぶんに語って聞かせる物語だ。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:0},
  {id:36, q:"34 社会が自分を含めた【   】によって構成されたものだとすれば、社会科学者は自分以外の他者に関心を向ける。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:2},
  {id:37, q:"35 世界戦争に象徴される今世紀の人間の体験は、征服のテクノロジーの中で非人格化した身体的存在を、「それでも人だ」と言うことから出発する【   】の思想を鍛えてきた。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:4},
  {id:38, q:"36 【   】の記憶に包まれることがなくなった知識だけの記憶は、それ自体として弱さをもっている。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:5},
  {id:39, q:"37 移植治療にとっては、訪れる死を確認していたのでは遅いのだ。そこで【   】を人の死とみなし、その段階で身体を人格性の拘束から解放することにする。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:1},
  {id:40, q:"38 封建的なシステムでは、世代間のバトンタッチという形で【   】ができ上がっている。結婚は当人の幸福のためにという近代的なモラルには、世代間の関係は組み込まれていない。*", opts:["アイデンティティ","脳死","他者","倫理","実存","身体"], a:3},
  {id:41, q:"39 【   】というかぎり、それは感情によって色どられていなければならない。感情のからみつきのない、自分の劣等性の認識は、むしろ【   】を克服した姿である。*", opts:["アイデンティティ","コンプレックス","ナルシシズム","エゴイズム"], a:1},
  {id:42, q:"40 西洋が非西洋に興味をもつとしても、つまるところ、自己の優位を証明するためという、「西洋」の【   】的な構造は変わらないだろう。*", opts:["アイデンティティ","コンプレックス","ナルシシズム","エゴイズム"], a:2},
  {id:43, q:"41 石油なしでは生きて行けない文化を未来の世代に残しながら、石油そのものは現在の世代が使いきってしまうという【   】は許されない。*", opts:["アイデンティティ","コンプレックス","ナルシシズム","エゴイズム"], a:3},
  {id:44, q:"42 兄弟姉妹がたくさんいれば、そこには兄弟間の【   】も生じるから、その克服の経験を通して、社会的自我を鍛えることもできる。*", opts:["強迫観念","反省","軋轢","葛藤"], a:2},
  {id:45, q:"43 政治と宗教は分離するべきであるという近代主義は、キリスト教ヨーロッパでは長い【   】の歴史を経過して確立してきました。*", opts:["強迫観念","反省","軋轢","葛藤"], a:3},
  {id:46, q:"44 いわゆる「主題」、それも短いことばで概括できるようなそれが寓意として託されていなければすぐれた近代小説とは言えないのではないか、といった【   】から、われわれはなお自由ではない。*", opts:["強迫観念","反省","軋轢","葛藤"], a:0},
  {id:47, q:"45 テレビを見たり、データベースを駆使する個人は、世界で生起するあらゆる出来事を知覚し、これらに対して総合的な【   】を加えうる。*", opts:["強迫観念","反省","軋轢","葛藤"], a:1},
  {id:48, q:"46 関心の自由、想像力の自発性を含めた精神の活発さを尊ぶのは【   】の思想である。*", opts:["ヒューマニズム","個人","個人主義","合理主義"], a:0},
  {id:49, q:"47,48 日本では、【 A 】と【 B 】との関係を考えるよりは、全体としての場を大切にするので、ともかく場を壊すことを避けたいと思う。*", opts:["A:個人 B:個人","A:個人 B:全体","A:個人 B:他者","A:個人主義 B:合理主義"], a:0},
  {id:50, q:"49 アメリカの社会学者、Ｇ・リッツアは「マクドナルド化」現象を、食べ物を自動車を作るように生産する無機的なプロセスが一般化すること、すなわち近代【   】の極北と評した。*", opts:["ヒューマニズム","個人","個人主義","合理主義"], a:3},
  {id:51, q:"50 技術は善という【    】と、科学の進歩を停止させよという反進歩主義は不毛な対立の軌跡を描いている。*", opts:["進歩主義","国民国家","資本主義","市場経済","ブルジョワジー","プロレタリアート"], a:0},
  {id:52, q:"51 （近代化のなかで、【   】の一員になれなかった）人々は行き場を失い、他民族の支配する領土の中で不安定な生活を強いられ、しばしば難民となってさまよう運命にさらされている。*", opts:["進歩主義","国民国家","資本主義","市場経済","ブルジョワジー","プロレタリアート"], a:1},
  {id:53, q:"52,53 近代においては【 A 】的な【 B James】のシステムがわたしたちの社会を支配しているので、ほとんどの技術とものは世界中で均質化していく傾向にある。*", opts:["A:資本主義 B:市場経済","A:市場経済 B:資本主義","A:進歩主義 B:国民国家","A:ブルジョワジー B:プロレタリアート"], a:0},
  {id:54, q:"54 （貴族たちの）華美な服装に対して、新興【   】は、「品位」という控えめの価値を対置し、「慎み、努力、正確、まじめ、節度、自制」などを可視化するような衣装を身にまとうようになる。*", opts:["進歩主義","国民国家","資本主義","市場経済","ブルジョワジー","プロレタリアート"], a:4},
  {id:55, q:"55 マルクスの認識では、【   】一般が「弱者」「敗者」である。*", opts:["進歩主義","国民国家","資本主義","市場経済","ブルジョワジー","プロレタリアート"], a:5},
  {id:56, q:"56 ジャーナリズムはすべての人に知や情報を共有させることによって、【   】を正しく機能させようとするものです。*", opts:["ファシズム","リベラリズム","ナショナリズム","デモクラシー"], a:3},
  {id:57, q:"57 【   】で期待されている市民像―自律的な個人、あるいは公的関心が高く活動的な市民。*", opts:["ファシズム","リベラリズム","ナショナリズム","デモクラシー"], a:1},
  {id:58, q:"58 十九世紀末から二十世紀にいたる世界の政治的歴史のなかで異様に強硬で排的な【   】が生まれてくる。*", opts:["ファシズム","リベラリズム","ナショナリズム","デモクラシー"], a:2},
  {id:59, q:"59 社会主義にせよ【   】にせよ、社会全体を管理できるとする全体主義にほかならない。*", opts:["ファシズム","リベラリズム","ナショナリズム","デモクラシー"], a:0},
  {id:60, q:"60 リオタールが「【   】」を「大きな物語から小さな物語へ」と定式化したように…*", opts:["プレモダン","モダン","ポストモダン","エコロジー"], a:2},
  {id:61, q:"61 現在、自然をとり戻そうとする【   】運動が、思想と実践の両面で前進してきている。*", opts:["プレモダン","モダン","ポストモダン","エコロジー"], a:3},
  {id:62, q:"62 本来は文化の【   】と異文化は必ずしも対立関係にはなく、グローバリゼーションも受け入れながら異文化は異文化として存在するというあり方になるのが一番良いのではないでしょうか。*", opts:["ポピュリズム","グローバリゼーション","マイノリティ","マジョリティ","リスク社会","冷戦"], a:1},
  {id:63, q:"63 世界が二つに分かれて対立していた【  】時代には、グローバリズムは現実的な課題としては登場していなかったのではあるまいか。*", opts:["ポピュリズム","グローバリゼーション","マイノリティ","マジョリティ","リスク社会","冷戦"], a:5},
  {id:64, q:"64 現在、世界各国を揺るがせている【   】の多くは、エリート批判を中心とする、「下」からの運動に支えられたものである。*", opts:["ポピュリズム","グローバリゼーション","マイノリティ","マジョリティ","リスク社会","冷戦"], a:0},
  {id:65, q:"65 【   】化の進行は、排除を促進したといえよう。その意味で、【   】とは、リスクを恐れるあまり社会性をなくした社会、というふうにもとらえられる。*", opts:["ポピュリズム","グローバリゼーション","マイノリティ","マジョリティ","リスク社会","冷戦"], a:4},
  {id:66, q:"66.67 全体を配慮した「弱い個人主義」は徹底的に【 A 】を擁護し徹底的に【 B】を排除する。そして、個人固有の思考を、生き方を奪ってゆく。*", opts:["A:マジョリティ B:マイノリティ","A:マイノリティ B:マジョリティ","A:グローバリゼーション B:ポピュリズム","A:ポピュリズム B:リスク社会"], a:0},
  {id:67, q:"68 一七九二年、フランス革命後の議会がルーヴル宮を美術館として一般に開放することを決定してはじめて、近代の【   】としての美術館が確立する。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:1},
  {id:68, q:"69 集団が及ぼす力は、外部から強制する暴力としてではなく、内面化された【   】の形をとって自然な感情の下に服従を促すのが望ましい。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:0},
  {id:69, q:"70 個人の無制限な自由から出発する能力主義、効率性の追求、利便性の追求という市場競争原理の中心的な価値を一度は疑ってみなければならない。新たな【   】の確立が求められているのである。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:2},
  {id:70, q:"71 インターネットは新聞をなくしはしないし、Ｅメールの配信や携帯電話の発達は郵便物の数を減らしてはいない。要するに【   】が増えて複合し、コミュニケーションのチャンネルが多元化する。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:3},
  {id:71, q:"72 「情報インフレ」は、世界大のできごと、地球の裏側のできごとまでも、瞬時にして私たちの手元の知覚であるかのような「【    】」として現象する。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:5},
  {id:72, q:"73 もはや万人に共通の場は存在せず、断片化した複数のカルチャーが散乱し、すべてが【   】化していると言ってもいいような状況だ。*", opts:["規範","制度","公共性","メディア","サブカルチャー","ヴァーチャル・リアリティ"], a:4},
  {id:73, q:"74 『源氏物語』のころの日本語【   】と現代のわれわれの日本語【   】とではすでに大幅に違っているわけです。*", opts:["コード","周縁","中心","人類学"], a:0},
  {id:74, q:"75 【   】がもっぱら対象としてきた「未開社会」は、人口の変動や技術の変化による社会の変化を極力排除しようとする点で、近代社会のような「変化」を常態とする社会とは異なっている。*", opts:["コード","周縁","中心","人類学"], a:3},
  {id:75, q:"76,77 まるで夜空の星のように、世界にはさまざまな文化や社会があるという世界観から、世界は一つの方向に向かって発展していく歴史の中にある、という世界観への転換が、この時から進み始めた。それは、世界には【 A 】とその【 B】がある、という世界観でもあった。*", opts:["A:中心 B:周縁","A:周縁 B:中心","A:コード B:人類学","A:人類学 B:コード"], a:0},
  {id:76, q:"78 外国人は外国の所謂「伝統的」音楽、舞踊、絵画などを理解しようとする場合、自身の【   】を満足させる習慣がある。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:1},
  {id:77, q:"79 【   】とは、「優越する西洋と劣弱な東洋とのあいだに根深い区別を設けること」であり、このような関係を再生産していく言説的編成のすべてである。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:0},
  {id:78, q:"80 欲望を【   】の拡張運動と理解してみよう。【   】の向こうにはまだ見ぬもの、見ることが禁じられているもの、神秘的なものが広がっている。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:3},
  {id:79, q:"81 多元主義的な【   】は、自己の所属する文化の価値観を妄信せず、他人の属する文化の価値をも同時に承認するのだから、それは、何よりも寛容の精神に基づかねばならない。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:5},
  {id:80, q:"82 イスラム系住民とよりよい社会関係を構築するにはどうすればよいか。一つは、アメリカやイギリス、オランダなどが採用する「【   】」にもとづくモデルです。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:4},
  {id:81, q:"83 「なにかお手伝いできることがありますか」そういうかたちで客のセルフ・ケアをケアするということ。そういう【   】がスタッフの仕事ではないだろうか。*", opts:["オリエンタリズム","エキゾシズム","ホスピタリティ","フロンティア","多文化主義","文化相対主義"], a:2},
  {id:82, q:"84 ハヤリとシキタリには共通点があり、それについて考えることは【   】学にとって無益ではない。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:0},
  {id:83, q:"85 【   】への帰属は、二重の意味で、先験的な選択として機能する。【   】は、基本的には文化の差異によって規定された集団である。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:1},
  {id:84, q:"86 現代の社会は、古い家族形態や地域共同体といった、従来からある【   】のきずなを破壊し、それに代わる組織は、個人を使い捨てにする傾向がある。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:2},
  {id:85, q:"87 「ニュースが中立公平である」という【   】は広くは疑われてこなかった。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:3},
  {id:86, q:"88 それらの生物も無機物も、あるいは自然界のあらゆるものを、魂と命とを持ったものとして心を通わせ、畏れ親しんだ【   】の思想、あるいは心情があった。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:4},
  {id:87, q:"89 山中では里での日常の言葉を使うことは【   】とされ、特別の名前がつくられていた。*", opts:["民俗","民族","共同体","神話","アニミズム","禁忌"], a:5},
  {id:88, q:"90,91 集団に強く組みこまれた個人にとって、世界とは集団そのものです。集団、または社会、または今此処の世の中、つまり【 A 】ということになるでしょう。死ぬと、日本人は、【A】から【 B】へ移るのかどうか。*", opts:["A:此岸 B:彼岸","A:彼岸 B:此岸","A:ハレ B:ケ","A:ケ B:ハレ"], a:0},
  {id:89, q:"92,93 衣服もまた、化粧とともに、人々の地位や生活様式、季節ごとの【 A 】と【 B】、あるいは悲しみと喜びを表現している。*", opts:["A:ハレ B:ケ","A:ケ B:ハレ","A:此岸 B:彼岸","A:彼岸 B:此岸"], a:0},
  {id:90, q:"94 水に流せるようになることが、【   】が望む最善の解決なのだろう。しかし多国籍企業の活動まで【   】的な価値観で判断するならば、おそらく国際社会では理解されないだろう。*", opts:["侘び","寂び","無常","世間"], a:3},
  {id:91, q:"95,96 営利に急なる財界の闘士が、早朝忘我の一時間を菊の手入れに費やすは一種の「【   】」でないとは言われない。*", opts:["わび","さび","無常","世間"], a:0},
  {id:92, q:"97 日本人は昔からそういう「はかなさ」に心ひかれ、人生の【   】に耽溺して来たと信じられている。*", opts:["侘び","寂び","無常","世間"], a:2},
  {id:93, q:"98 江戸時代において、【   】運動が「からごころ（中国的な精神）を清く去る」という外来精神の排除と結びついていたのはご承知のとおりです。*", opts:["型","言霊","国学","国粋主義"], a:2},
  {id:94, q:"99 これはすべて「名が対象と同じ力を持つ、もしくは対象を出現させる」という【   】思想であり、我が国の雨ごいの儀式もその一つと考えられよう。*", opts:["型","言霊","国学","国粋主義"], a:1},
  {id:95, q:"100 昔の日本人の手紙には一つの【   】があった。いまの日本人はその【   】を捨てたから手紙一つ満足に書けない。【   】に則った手紙がみんな同じ内容かというとそうではない。*", opts:["型","言霊","国学","国粋主義"], a:0},
  {id:96, q:"101 近代の西欧思想では、芸術家の創造はすべて個性的かつ【   】なものでなければならない。*", opts:["模倣","創造","コピー","アウラ","オリジナル"], a:4},
  {id:97, q:"102 【   】や贋物がもとの本物にとって代わることなどあり得ないのである。*", opts:["模倣","創造","コピー","アウラ","オリジナル"], a:0},
  {id:98, q:"103 人類は、自然を都合よく支配して行くための手段として、科学技術を手にした。そして人類は自らの前途を、自らの手で【   】することの可能性へと目を開かれた。*", opts:["模倣","創造","コピー","アウラ","オリジナル"], a:1},
  {id:99, q:"104 日本的思考は、しばしば、【   】をこととする。*", opts:["模倣","創造","コピー","アウラ","オリジナル"], a:0},
  {id:100, q:"105 複製技術が発達して、いくらでもイメージの繰り返しが利くということになると、貴重で特権的な瞬間から【   】が失われていく。*", opts:["模倣","創造","コピー","アウラ","オリジナル"], a:3},
  {id:101, q:"106 近代以前の地図は、世界をそのような【   】の相を通して理解しようとはしていない。*", opts:["自然主義","モチーフ","リアリズム","ロマンティシズム"], a:2},
  {id:102, q:"107 海の日の沈むをみればたぎり落つ異郷の涙―といえば、【   】ともきこえようが…*", opts:["自然主義","モチーフ","リアリズム","ロマンティシズム"], a:3},
  {id:103, q:"108 明治の末期【   】の大波が文学の分野を震撼させたが、…*", opts:["自然主義","モチーフ","リアリズム","ロマンティシズム"], a:0},
  {id:104, q:"109 こころの動かし方に瞬間的にみえる深い淵を覗いてみせるというのが作品の【   】とおもわれます。*", opts:["自然主義","モチーフ","リアリズム","ロマンティシズム"], a:1},
  {id:105, q:"110 「わたしの身体」とわたしたちは簡単に言う。しかし、自分の身体を、わたしたちはどのように【   】しているだろうか。*", opts:["象徴","表象","オブジェ","カタルシス"], a:1},
  {id:106, q:"111 読者は自分自身の体験や気持ちをその作品の上に重ね合わせて【   】を得ることができる。*", opts:["象徴","表象","オブジェ","カタルシス"], a:3},
  {id:107, q:"112 カタツムリや貝の殻、甲虫類の死骸、小石などが【   】のように配置され、ときには草の汁で壁面が青く塗られることもある。*", opts:["象徴","表象","オブジェ","カタルシス"], a:2},
  {id:108, q:"113 文学読書は、作者の意図と覚しきものへ限りなく接近して行かなければならない生真面目な苦行ではなく、ひとつの【  】からも無限に多様な意味を生産することが可能なたわむれの自由として考えられるようになったのだ。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:0},
  {id:109, q:"114 集団に共通の規範を【   】した成員は、自分の行為に対する報酬として、この規範によって定められた量以上のもの、あるいは以下のものを望まない。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:2},
  {id:110, q:"114 本能的生活によって智的生活は【   】されなければならぬ。本能的生活によって智的生活は統合されなければならぬ。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:2},
  {id:111, q:"115 そこには人間を見下して軽蔑しながら憐むところの「神」の散大した【   】はない。これこそ現代小説が自然に到達した方法で…*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:1},
  {id:112, q:"116 暫くすると、山田美妙君の【   】が発表された。見ると「私は……です。」の敬語調で、自分とは別派である。即ち自分は「だ」主義、山田君は「です」主義だ。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:4},
  {id:113, q:"117 両親の夫婦喧嘩が、子供の人生をどんなにいためつけるかということを考えないで、同じことをしばしばくりかえしている理解しがたいおとなの【   】。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:3},
  {id:114, q:"118 自分の場合を例にとっていうと、作者はつとめて【   】的に流れることを抑制しながら仕事をしている場合が多い。*", opts:["テクスト","視点","内面化","不条理","言文一致","叙情（抒情）"], a:5},
  {id:115, q:"119 次の文章は、私の昔の小説の一節であって、やはりおどけた【   】には違いないのであるが…*", opts:["散文","韻文","虚構","私小説"], a:0},

  {id:118, q:"123,124 【A 】に【 B】をあたえ、対象を明確に認識させるのは、ほかならぬ「先輩や師匠」たちの「眼」なのである。*", opts:["A:混沌 B:秩序","A:秩序 B:混沌","A:必然 B:偶然","A:偶然 B:必然"], a:0},
  {id:119, q:"125,126 歴史的過去も、【 A 】整合性と【 B】整合性をもつ限り、その実在性は歴史学理論と史料によって支えられているのである。*", opts:["A:共時的 B:通時的","A:通時的 B:共時的","A:正統 B:異端","A:異端 B:正統"], a:0},
  {id:120, q:"127 動物の信号は、指示対象の存在が原因となって生じた結果である。そうした【   】の結果に関して、その真偽を問うことは、そもそも意味を成さない。*", opts:["必然","混沌","因果","背理","秩序","偶然"], a:2},
  {id:121, q:"128,129 相手との関係は、【 A 】的な因果的連鎖で結ばれているわけではない。半ば【 B】で、半ば【 A】の偶有性こそが、コミュニケーションの現場を支配する。*", opts:["A:必然 B:偶然","A:偶然 B:必然","A:秩序 B:混沌","A:混沌 B:秩序"], a:0},
  {id:122, q:"130 「愛情」を適切にかたちで注げば注ぐほど、そのぶんだけ子どもは「すくすくと」育ち、親からうまく離れて自立の道を歩んでいくという【   】の関係にあるのが親子関係の本質である。*", opts:["必然","混沌","因果","背理","秩序","偶然"], a:2},
  {id:123, q:"131,132 ヨーロッパの美に近づいて行くについて、私は、自分で考えてみて、ヨーロッパの【 A 】とされるものに比べてはいかにも【 B】的な道をたどったものだと思う。*", opts:["A:正統 B:異端","A:異端 B:正統","A:共時的 B:通時的","A:通時的 B:共時的"], a:0},
  {id:124, q:"133 客観的な【   】があるために敵対関係が生まれるのではない。人種差別や民族紛争は【   】という与件を原因とするのではない。逆に、等質の場に無理矢理くさびを打ち込んで【   】化を謀る運動なのである。*", opts:["差異","正統","異端","共時的","通時的"], a:0},
  {id:125, q:"134 或る他者が誰であるかということは、つねに自己が誰であるかということと密接に関連していて、窮極的にはこれに【   】されてしまう。*", opts:["矛盾","還元","類型","捨象"], a:1},
  {id:126, q:"135 物理学者が物体の複雑な運動を観察して、これを求心運動、等加速運動などに分解してその中の一つを抽出し他を【   】する事によって、そこに普遍的な法則を設定する。*", opts:["矛盾","還元","類型","捨象"], a:3},
  {id:127, q:"136 梅に鶯が【   】で古典的だというなら、外の小鳥をとまらせて御覧なさい。なかなかしっくりとはゆかぬものだ。*", opts:["矛盾","還元","類型","捨象"], a:2},

  {id:129, q:"138 どうかすると、二者のいずれかを選ばねばならぬ【   】に陥ることもないとは限りません。*", opts:["両義","齟齬","ジレンマ","一義","逆説"], a:2},
  {id:130, q:"139 そこに、身体と私をめぐる関係の決定的な【   】のようなものが生じ始めるだろう。*", opts:["両義","齟齬","ジレンマ","一義","逆説"], a:1},
  {id:131, q:"140 身体ないし生命としての「私」を維持するために、いつも外部から「他者」を取り込まなければならない、という【   】。*", opts:["両義","齟齬","ジレンマ","一義","逆説"], a:4},
  {id:132, q:"141 礼拝するものとしてあるのではなく、見るものとしてある。それが、近代人にとっての芸術作品の第【   】の意味だ。*", opts:["両義","齟齬","ジレンマ","一義","逆説"], a:3},
  {id:133, q:"142 ことばは身体に根ざし、それでいて身体を越えるもの。そうした【   】を本性とする。*", opts:["両義","齟齬","ジレンマ","一義","逆説"], a:0},
  {id:134, q:"143,144 文化とは、一面こそ秩序と制度からなる【 A】な二項対立の網であっても、同時に【 B】な生命の波動でもある。*", opts:["A:デジタル B:アナログ","A:アナログ B:デジタル","A:無機的 B:有機的","A:有機的 B:無機的"], a:0},
  {id:135, q:"145 生命には、パーツが張り合わされて作られるプラモデルのような【   】では説明不可能な重要な特性が存在している。*", opts:["有機的","無機的","アナログ","アナロジー","デジタル"], a:1},
  {id:136, q:"146 ここでは精神は【   】に自然と一体となり、自然は精神と融合している。*", opts:["有機的","無機的","アナログ","アナロジー","デジタル"], a:0},
  {id:137, q:"147 さらには、自他の肉体をも【   】に「もの」と化させ、スイッチを切り換える単純さで扱って見せたりして、私どもを戦慄させるのだ。*", opts:["有機的","無機的","アナログ","アナロジー","デジタル"], a:1},
  {id:138, q:"148 「永遠の都」という言葉は単なる【   】ではなく、文字通り都市のあるべき姿を示しているのである。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:2},
  {id:139, q:"149 黙読は、その後に「黙って読む練習」を先生に教えられ、それがマスターできてはじめて習得される【   】である。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:0},
  {id:140, q:"150 鹿鳴館に【   】される「文明開化」の珍風景があちこちでくりひろげられたのは、明治十年代の後半であり、漱石の青春期に当たっている。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:1},
  {id:141, q:"151 概して言えば【   】法は、後飛鳥期にもあったが、藤原期の柿本人麻呂の力が、主としてはたらいて、完成した様である。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:3},
  {id:142, q:"152 「病」、それはあくまで世界についての一定の文化的な解釈体系の中で分類されて初めて存在するようになるものであり、したがってそこにはどうしても【   】としての性格がつきまとう。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:4},
  {id:143, q:"153 現代の吾等は、【   】らしい表現に、陳腐を感じたり、反感を持ったりすることを止めて、一首全体の態度なり気魄なりに同化せんことを努むべきである。*", opts:["リテラシー","象徴","修辞","直喩","隠喩","擬人法"], a:2},
  {id:144, q:"154 無機物の石が山を、同じく砂が水を【   】するということは、よくいわれてはいるが、その【   】によって何が本当に語られているかは、一つの問題である。*", opts:["警句","寓意","デフォルメ","アイロニー","ステレオタイプ"], a:1},
  {id:145, q:"155 美術品であるという運命をになったミロのヴィーナスの失われた両腕は、ふしぎな【   】を呈示するのだ。*", opts:["警句","寓意","デフォルメ","アイロニー","ステレオタイプ"], a:3},
  {id:146, q:"156 人生は何事をも成さぬにはあまりに長いが、何事かを成すにはあまりに短いなどと口先ばかりの【   】を弄しながら、…*", opts:["警句","寓意","デフォルメ","アイロニー","ステレオタイプ"], a:0},
  {id:147, q:"157 幼児の描く絵では、顔の造作がみごとなまでに【   】であるのと同じように、大人の場合の顔の知覚は、その表情の認知がとても定型的である。*", opts:["警句","寓意","デフォルメ","アイロニー","ステレオタイプ"], a:2},
  {id:148, q:"158 例えば地下鉄やバスの路線図では、駅間の距離や方位は無視ないし【   】されて、そこで必要＝有意味な情報としての路線間の位相的な接続関係だけが明示的に示されている。*", opts:["警句","寓意","デフォルメ","アイロニー","ステレオタイプ"], a:2},
  {id:149, q:"159 思い出は甘美な個人的感懐ではあっても、【   】主観的な歴史ではない。*", opts:["化","観","間","プレ","メタ","ポスト"], a:2},

  {id:153, q:"161 社交はグローバル化と【   】工業化に乗って、消費の中心のみならず、生産の場にも復活しつつあると見ることができるだろう。*", opts:["化","観","間","プレ","メタ","ポスト"], a:5},
  {id:154, q:"162 青春の恋愛は【   】現実的な無限世界で、これもやっぱり本能に属する世界であるにすぎず、その夢はやがて破れ、…*", opts:["不","没","非","無","超"], a:4},

  {id:203, q:"211 哲学的であれ、科学的であれ、政治的であれ、宗教的であれ、純粋性なるものへの固執は、近代が生んだ最大の【   】のひとつである。*", opts:["ナイーブ","シニカル","ニヒリズム","ストイック","フェティシズム","オプティミズム"], a:4},
  {id:204, q:"212 万年筆で手紙を書くにも、プリンターで画像を出力するにも、まずは【  】な白い平面としての紙がそこにあった。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:0},
  {id:205, q:"213 多様性をもつ人間にとって差異を差異として相互に尊重し承認し合う【   】な観点が不可欠である。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:3},
  {id:206, q:"214 いっそ、芸術はいかなる意味でも技術ではないとする【   】な主張もある。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:4},
  {id:207, q:"215 古い秩序が崩壊している【   】な状態、これが群衆発生の基盤です。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:2},
  {id:208, q:"216 【   】もいいところであって、わたしのなりたかった詩人というのは新体詩人なのであった。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:5},
  {id:209, q:"217 無垢な表情をたたえた裸の子どもたち。着飾った少女たち……。こうした【   】な風景への接触は、常に写真機のファインダー越しに行われてゆく。*", opts:["ニュートラル","プリミティブ","アナーキー","リベラル","ラディカル","アナクロニズム"], a:1},
  {id:210, q:"218 上品なうえに【   】だった。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:0},
  {id:211, q:"219 ニューヨークにも、あるいはシドニーでも香港でも、たがいに見わけることが困難なまでに、【   】の似かよった高層ビルが立ちならんでいる。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:5},
  {id:212, q:"220 だが【   】と批判精神に満ちたオーストラリアの人も、自国を中心に置く習慣からは逃れられなかったらしい。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:1},
  {id:213, q:"221 人間としての【   】とは、つまり、禽獣と異る人間性の自覚である。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:3},
  {id:214, q:"222 日本の古典芸能は様式の【   】によって成立している。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:4},
  {id:215, q:"223 長く武器を封印し、戦争を放棄して、平和を【   】してきた日本人。*", opts:["粋","機知","謳歌","矜持","美学","意匠"], a:2},
  {id:216, q:"224 『ガリヴァー旅行記』は世界中のこどもに読まれているが、もともとは、政治【   】小説だったのである。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:4},
  {id:217, q:"225 単に童謡は【   】的なものと思惟している人がある。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:2},
  {id:218, q:"226 ニーチェのこの言葉は、少数の著者が多数の読者を啓蒙し教化する、という活字書物文化の特質を【   】したものと考えられる。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:3},
  {id:219, q:"227 けだし科学は、詩的精神の最も大胆な【   】であって、その否定するところのものから逆に他の「夢」を創ろうとする。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:0},
  {id:220, q:"228 「声なき声」などというレトリックはそもそも、【   】にすぎないのではないか。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:1},
  {id:221, q:"229 〈ミスターＪ〉と名付けられたこの「スーパーマン」は、【   】なコラムによってマスコミの寵児になってゆく。*", opts:["反語","詭弁","諧謔","辛辣","諷刺","揶揄"], a:5},
  {id:222, q:"230 両者の立場の相違がよくわかる。一は公理から【 A】し一は事実から【 B】するのである。*", opts:["A:演繹 B:帰納","A:帰納 B:演繹","A:措定 B:類推","A:類推 B:措定"], a:0},
  {id:223, q:"231  この鼻とこの顔は到底調和しない。それを厳格に力学上の公式から【   】して御覧に入れようと云うのであります。*", opts:["弁証法","帰納","類推","措定","演繹","理念"], a:4},
  {id:224, q:"232 社会主義の崩壊は、個人の自由という【   】の勝利を意味していると受けとめられた。*", opts:["弁証法","帰納","類推","措定","演繹","理念"], a:5},
  {id:225, q:"233 こうして、表現と沈黙の関係は表現意識に課せられた矛盾の【   】となる。*", opts:["弁証法","帰納","類推","措定","演繹","理念"], a:0},
  {id:226, q:"234 情念を「受動」と【   】する考え方はなにもこと新しいものではない。*", opts:["弁証法","帰納","類推","措定","演繹","理念"], a:3},
  {id:227, q:"235 行動主義を批判したゲシュタルト心理学は、電磁場理論からの【   】で心理学的な現象を説明しようと試みた。*", opts:["弁証法","帰納","類推","措定","演繹","理念"], a:2},
  {id:228, q:"236  世界を【   】する視点、それは、神の視点にほかならない。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:1},
  {id:229, q:"237 ここでの自律とは経験を【   】した形而上学的な概念ではない。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:2},
  {id:230, q:"238 ピラミッドでは、時は停止する。時間の【   】のためにまず選ばれたもの、時の支配へのエジプト文明の試みの記念碑が、ピラミッドなのである。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:3},
  {id:231, q:"239 裁判の判決は、法廷という場で、声に出して言いわたすことが必要なのだ。宣誓、読経、祝詞―みな、声の力が文字を【   】している。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:0},
  {id:232, q:"240 これは、被害者にも一定の過失が認められる場合、損害の割合を被害者・加害者間で分配し、加害者の過失の一部分を【   】しようという制度である。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:5},
  {id:233, q:"241 真の二元的対立は、人生におけるもっと本質的な分裂・【   】をめぐって発生してくるものなのだ。*", opts:["凌駕","俯瞰","超越","超克","相克","相殺"], a:4},
  {id:234, q:"242 今こそ、人間は類人猿の社会を見習い、【   】な目で過去に通ってきた精神世界を見つめ直す時なのかもしれない。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:3},
  {id:235, q:"243 若さを嫉妬して、老いが【   】な方法で巧みに責め苛んでいるようにさえ見える。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:1},
  {id:236, q:"244 多くのひとは定型に沿って一生を紡ぐ。そのことが【   】だという気は毛頭ない。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:0},
  {id:237, q:"245 だが、どのようにして実際に金貨や銀貨が偽造されるかをこれ以上【   】してもしようがあるまい。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:2},
  {id:238, q:"246 然るにその出版の好機がなく、且つ詩の数が少し予定に足りないので、そのまま【   】に附してしまった。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:5},
  {id:239, q:"247 第二の手段は、自国の利益に直接係わる場合にのみ問題の領域に介入し、国益を強く【   】に主張する外交である。*", opts:["不遜","狡猾","詮索","真摯","執拗","等閑"], a:4},
  {id:240, q:"248 こうして神は死に、自然は人間によって【   】され、無視されてしまったのである。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:4},
  {id:241, q:"249 【   】的教化に服さず、征服者に最後迄で反抗する民だ。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:0},
  {id:242, q:"250 医師たちのこの種の「技術的」活動が、全く無思想できわめて非倫理的と【   】されたとしても、恐らく反論は困難だろう。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:1},
  {id:243, q:"251 思えば二十世紀は十九世紀の蒸気を電気で【   】し、十九世紀の知らなかった飛行機や核エネルギーや、抗生物質や遺伝子操作の開発で文明を一変した。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:5},
  {id:244, q:"252 民主主義は日々つくられるのではなくて既存の「状態」であり、この「状態」の【   】はいわば自動的に「反民主主義」のレッテルをはられてしまいます。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:3},
  {id:245, q:"253 それは一般民衆をも、人間精神の普遍性へとたかめようとする、【   】のプロジェクトである。*", opts:["懐柔","弾劾","啓蒙","攪乱","蹂躙","駆逐"], a:2},
  {id:246, q:"254 他人に見られている私は、私でありながら私自身から【   】され、私の自由にならないものになっている。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:5},
  {id:247, q:"255 ここで注意を【   】しておきたいのは、小林が示した「唯一つ」の「真実」とは絶対的な、唯一の真実という意ではないと云う事だ。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:2},
  {id:248, q:"256 まごころをしみじみと【   】するといった野暮ったい身振りほど百閒から遠いものはない。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:1},
  {id:249, q:"257 学生達の行動に対するこうした私の拡大解釈は、しかし、私を次のような【   】へと誘う。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:4},
  {id:250, q:"258 旅そのものが安定したアイデンティティの実践であることをやめ、行方のない【   】を開始したのだ。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:3},
  {id:251, q:"259 留学の利点は何だろう。関心領域における本場で学ぶことで、日本では得られない情報を収集したり、その分野で権威をなす教授の【   】を受けるためだと考えられている。*", opts:["薫陶","吐露","喚起","彷徨","杞憂","疎外"], a:0},
  {id:252, q:"260 停滞や【   】、逸脱は、ここでは技術の未熟である。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:3},
  {id:253, q:"261 かつての軍国主義は異なった文化社会の人々を一掃殲滅することに何の【   】も示さなかった。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:0},
  {id:254, q:"262 私は人の身の上に就いて自動的に世話を焼くのは、どうも【   】で出来ないたちなので、そのままにして置いた。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:2},
  {id:255, q:"263 鏡のなかのじぶんをのぞきこんでいるときに、その場面を他人に目撃されると、何かいけないことをしていたかのように【   】してしまう。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:5},
  {id:256, q:"264 今日、諸君のこの厚意に対して、心窃に【   】たらざるを得ない。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:1},
  {id:257, q:"265 豊年でもなんとか理屈をつけてはかりを負けてもらう算段に【   】するのが小作人の習いであった。*", opts:["躊躇","忸怩","億劫","逡巡","腐心","狼狽"], a:4},
  {id:258, q:"266 動物はこのように、私たちだったら制約と考えるような環境条件にとけ込み、【   】され、適応している。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:4},
  {id:259, q:"267 戦争とは集団をもってする暴力行為であり、各人の行為は集団の意識によって制約ないし【   】される。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:2},
  {id:260, q:"268 伝統とか、国民性とよばれるものにも、時として、このような【   】が隠されている。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:5},
  {id:261, q:"269 コペルニクスは旧来の宇宙観を完全に【   】したうえで新しい体系を提示したわけではなかった。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:1},
  {id:262, q:"270 古に【   】してあらゆる未来の作物にこれらを応用して得たりと思うは誤りである。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:3},
  {id:263, q:"271 社会民衆の【   】に任せて安堵しているのも間違っている。*", opts:["恣意","払拭","鼓舞","拘泥","馴致","欺瞞"], a:0},
  {id:264, q:"272 なにか一度リハーサルのすんだお芝居をやっているような、【   】たる思いを味わう恐れが強いのです。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:5},
  {id:265, q:"273 初期近代は、怠惰の烙印をおされた【   】に対する国家とブルジョワの共同闘争の時代であった。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:0},
  {id:266, q:"274 あまりにも頭がよく、俊敏明察の人であった秋成は、世間の大方の人の多欲、通俗、【   】に堪えられなかったのでしょう。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:2},
  {id:267, q:"275 自分といふものをある限度まで【   】しない人間が、小説を書ける筈のものではない。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:3},
  {id:268, q:"276 戦術においては、深い【   】があるという評判の人であった。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:4},
  {id:269, q:"277 あまりの恐怖に、奇妙な【  】が起ったのである。*", opts:["無為","倒錯","蒙昧","知悉","造詣","索漠"], a:1},
  {id:270, q:"278 なぜ流行の思想や文学を読むことが読書にならないかといえば、【   】性を基本としているからです。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:4},
  {id:271, q:"279 人間にとって、「清潔」は本能的な快楽なのである。【   】物・不純物のない―異分子を排除した統一感・一体感。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:5},
  {id:272, q:"280 通常、所得格差は世帯（家族）単位で報告されるが、これは個人単位で見た格差と【   】することがある。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:3},
  {id:273, q:"281 【   】科学が、今日ほど人を容易に騙しうる時代はない。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:1},
  {id:274, q:"282 【   】して動き出さない時間を解きほぐすきっかけになるものが、二人の手の内にないことも、知っていた。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:2},
  {id:275, q:"283 そこでは人間存在の【   】の秘密が強制的に奪われてしまう。*", opts:["可塑性","似而非（似非）","膠着","乖離","画一","夾雑"], a:0},
  {id:276, q:"284 科学の目標は、対象たる物質を【   】のものとして、その起源・構造・運動・変化の法則性を明らかにすることにある。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:1},
  {id:277, q:"285 想像力の想像力たる【   】は、過去のではなく前世の、未来のではなくて来世の姿を交感的に想い浮かべるところにある。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:0},
  {id:278, q:"286 時代の【   】に逆らってグローバル化の進展を妨げたとしても、それは結局、古い窮乏の不幸を呼び戻すことになる。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:4},
  {id:279, q:"287 この歌は、日本の伝統文化のなかで「住まうこと」がもっている意味、「住まうこと」に含まれる身体のあり方の重要性を【   】に表現している。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:3},
  {id:280, q:"288 児童は自分の生活とその周辺とを観察し記録することによって、公私の生活の不合理を認識する【   】をつかむ。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:2},
  {id:281, q:"289 そもそも、ある生物がある場所に住んだことによってその環境を変化させてしまうことが、遷移を導く【   】になる。*", opts:["所以","所与","端緒","端的","趨勢","契機"], a:5},
  {id:282, q:"290 風土的条件と歴史の積み重ねによって形成された習俗、価値観、行動様式などの総体およびその【   】を「文化」と呼ぶのである。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:3},
  {id:283, q:"291 歴史が重層的だとするなら、われわれは決して近代という用語によって一括りにできるような普遍的世界へと【   】することなどありえない。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:0},
  {id:284, q:"292 「わが友」というよびかけは、たいていは、援助の義務があったことを思い出させるための【   】である。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:2},
  {id:285, q:"293 様式の【   】だけの博物館的保存は、演劇に関する限りまったくのナンセンスではないか。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:4},
  {id:286, q:"294 そうでなければ、たとえ短期的にはなんとかやっていけるとしても、早晩【   】されてしまうだろう。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:1},
  {id:287, q:"295 現代社会には近代文明の複雑化が引き起こし、グローバル化がそれに輪をかけた不安が【   】している。*", opts:["収斂","淘汰","伏線","所産","形骸","蔓延"], a:5},
  {id:288, q:"296 この一例だけを見ても、親と同じ生涯を送ることがどんなに【   】な僥倖であるかわかるだろう。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:0},
  {id:289, q:"297 日本の古典的教育、すなわち芸事には、身体性への感覚評価が【   】に示されている。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:5},
  {id:290, q:"298 歴史とはわれわれに人間関係の【   】を理解させてくれる営みである。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:2},
  {id:291, q:"299 「未来」が眼前に顕現したときには、まさにその【   】においてすでに「過去」になっている。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:4},
  {id:292, q:"300 心の喪失が、ことばを「流行」のものとしたのである。ことばの【   】さとは、心の持続を意味する。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:3},
  {id:293, q:"301 芭蕉によれば、生々化々するあらゆる現象は、【   】のあらわれであった。*", opts:["稀有（希有）","造化","機微","不易","刹那","如実"], a:1},
  {id:294, q:"302 農耕の豊饒を願う祭式【   】は女性行事であった。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:0},
  {id:295, q:"303 組織には合理的な契約とは別に、構成員の情緒的な帰属の感覚がなければならず、そのために彼らをつなぎとめる【   】の中心が求められることになる。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:3},
  {id:296, q:"304 会社は【   】的なもので、宗教は神聖なものであるという聖俗二元論は、日本の会社にはかならずしも当てはまらない。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:2},
  {id:297, q:"305 哲学とのかかわりはいわば【   】のようなかたちをとり、ほとんど一過性のものであるにとどまった。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:1},
  {id:298, q:"306 大事なことを世代から世代へ伝えるための【   】というやつですね。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:4},
  {id:299, q:"307 まるで世界はすべて夢に過ぎないという【   】に加担しようとしているかのようだが、そうではない。*", opts:["呪術","通過儀礼","世俗","帰依","口承","諦念"], a:5},
  {id:300, q:"308 ひとは小心翼々としていると創造的でありえなくなる。これは行きすぎた抑制や禁欲的態度がおちいりやすい【   】を示している重要な指摘である。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:2},
  {id:301, q:"309 国民国家そのものは、―依然としてそれがわれわれを捕縛してはいるが、―ことあらためて注目されるような新しい【   】ではない。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:4},
  {id:302, q:"310 まだ小さい子供二人を除いて、上の二人はどこかへ連れ去られ、一家離散の【   】をなめました。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:5},
  {id:303, q:"311 階級闘争と民族運動の背後にある社会的【   】を多元的に捉えようとする視点が提起されている。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:3},
  {id:304, q:"312 オリンピックは非政治性が【   】であったが、それだけにいろいろなネーション・ステート間の政治的対立が露出して見えたのである。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:0},
  {id:305, q:"313 すなわち、ここでは人間の感情はつねにものの描写のかたちで伝えられ、ものの実在性によって【   】性を助けられます。*", opts:["建前","信憑","陥穽","紐帯","桎梏","辛酸"], a:1},
  {id:306, q:"314 【   】者芭蕉の俳諧とはすでにまったくちがう世界がここに開けていることは一読了然であろう。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:0},
  {id:307, q:"315 私自身も、秀吉や白石の【   】に接したい気持が充分にあった。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:1},
  {id:308, q:"316 「助かる見込のない事を宣告された時の伯父は、実に【   】としていて、顔色一つ変えなかった」と附加えてあった。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:4},
  {id:309, q:"317 発話者の真意がとんでもなく【   】されて伝わることが絶えず起る。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:2},
  {id:310, q:"318 一般に知識は、「真」であることを【   】している。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:3},
  {id:311, q:"319 放送メディアは、いかに【   】なニュースの場合でも、受け手の多様な感覚をなまなましく動員するという性質を持っています。*", opts:["求道","謦咳","歪曲","標榜","従容","即物的"], a:5},
  {id:312, q:"320 釣をしないからああいう風に【   】的になるのだと合点して、むやみに弟を釣に引張り出そうとするのです。*", opts:["退廃（頽廃）","慙愧","懶惰","呵責","狷介","厭世"], a:5},
  {id:313, q:"321 私が【   】している事を信じて下さい。私は悪い男ではありません。*", opts:["退廃（頽廃）","慙愧","懶惰","呵責","狷介","厭世"], a:1},
  {id:314, q:"323 八年まえの事でありました。当時、私は極めて【   】な帝国大学生でありました。*", opts:["退廃（頽廃）","慙愧","懶惰","呵責","狷介","厭世"], a:2},
  {id:315, q:"324 ぼくは彼が【   】なヒネクレた態度を固執せずに、気持ちよくぼくに応えてくれたことが嬉しかった。*", opts:["退廃（頽廃）","慙愧","懶惰","呵責","狷介","厭世"], a:4},
  {id:316, q:"325 世の中から爪弾きされはせぬかという懸念、そんなものを人は良心の【   】と呼んで落ちついているようである。*", opts:["退廃（頽廃）","慙愧","懶惰","呵責","狷介","厭世"], a:3},
  {id:317, q:"326 俗悪ならんとして俗悪である【   】自在さがむしろ取柄だ。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:0},
  {id:318, q:"327 【   】無礼、偽善、迎合、幼児性といった芳しからぬ言葉をいくつも連想した。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:2},
  {id:319, q:"328 この僧は六十近い、丸顔の、達磨を草書に崩したような容貌を有している。老人とは平常からの【   】と見える。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:4},
  {id:320, q:"329 日本人は昔から人生の無十分に【   】して来たと信じられている。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:1},
  {id:321, q:"330 ジャーナリズムの【   】も手伝って、嫉妬の対象がたえず再生産される構造が生まれたのである。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:5},
  {id:322, q:"331 人間一人一人は脆弱で【   】な存在だ。しかし、千年以上もの歴史を持つ季語に寄り添うことで、個々の人間も悠久の時間のひとこまに参与できる。*", opts:["闊達","耽溺","慇懃","矮小","昵懇","扇情（煽情）"], a:3},
  {id:323, q:"332 文学の世界では、文化の外から内へというこの【   】の動きが、地球上のあちこちでほぼ同時に起こった。*", opts:["対峙","邂逅","越境","遡行（溯行）","跳梁","漂泊"], a:2},

  {id:325, q:"334 近代人は自分を世界の中心として自覚し、控えめにいっても、世界と【   】する誇り高い存在として感じはじめました。*", opts:["対峙","邂逅","越境","遡行（溯行）","跳梁","漂泊"], a:0},
  {id:326, q:"335 フロイトなら、これを幼児が理由もわからずに母親から拒絶される原体験に【   】して考えるかもしれない。*", opts:["対峙","邂逅","越境","遡行（溯行）","跳梁","漂泊"], a:3},
  {id:327, q:"336 わたしにとって、旅には、【   】や放浪のイメージと切り離しがたいものがある。*", opts:["対峙","邂逅","越境","遡行（溯行）","跳梁","漂泊"], a:5},
  {id:328, q:"337 昨今、野卑で小物の政治家の【   】が目に余る。*", opts:["対峙","邂逅","越境","遡行（溯行）","跳梁","漂泊"], a:4},
  {id:329, q:"338 どんなに【   】した生活にも、その生活の中の最良の味というものがある。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:1},
  {id:330, q:"339 狂詩にしろ奇行にしろ、どうもその陰に【   】する傾きのあるのは見逃せない。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:4},
  {id:331, q:"340 西欧近代の専制の地位は、旧植民地の独立、第三世界の【   】によって崩れ去った。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:0},
  {id:332, q:"341 そうしてその寛容によって、寛容する人自身がどれほど品性を【   】されるかを学びました。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:3},
  {id:333, q:"342 管弦楽の指揮者は作曲者と同様に各楽器の特質によく【   】していなければならない。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:5},
  {id:334, q:"343 なぜなら民衆は、彼等を甘やかすことによって益々堕落し、【   】することによって向上してくるからだ。*", opts:["台頭（擡頭）","逼塞","鞭撻","陶冶","韜晦","通暁"], a:2},

  {id:336, q:"345 私が大金持になった時には、世辞も【   】もしますけれど、一旦貧乏になって御覧なさい。柔しい顔さえもして見せはしません。*", opts:["粉飾","捏造","追従","敷衍","夭逝","物色"], a:2},
  {id:337, q:"346 旅行者が、旅路の見聞談を【   】して話した為に、都の人々は非常な興味を持って居た。*", opts:["粉飾","捏造","追従","敷衍","夭逝","物色"], a:0},
  {id:338, q:"347 〈歴史〉は書かれることによって作られる。断るまでもないが、それはいわゆる歴史的事実が恣意的に【   】されるということではない。*", opts:["粉飾","捏造","追従","敷衍","夭逝","物色"], a:1},
  {id:339, q:"348 眼中の小世界はただ動揺であった、乱雑であった、そうしていつでも【   】であった。*", opts:["粉飾","捏造","追従","敷衍","夭逝","物色"], a:3},
  {id:340, q:"349 食後はあてもなくモールをふらつき、人生のハプニングと出くわすのを待ちわびつつ、世界を【   】した。*", opts:["粉飾","捏造","追従","敷衍","夭逝","物色"], a:5},
  {id:341, q:"350 おそらく気が小さい癖に不満ばかりがあり…そんな気分をランボウの詩で【   】していたに違いない。*", opts:["慰藉","衷心","憐憫（憐愍）","忖度","断腸","顰蹙"], a:0},
  {id:342, q:"351 私は大声挙げて泣いた。たけいない、たけいない、と【   】の思いで泣いて…*", opts:["慰藉","衷心","憐憫（憐愍）","忖度","断腸","顰蹙"], a:4},
  {id:343, q:"352 しかしあのときはまだそこまで大陸のことばが出ず、ただじっと少年の顔をうかがった。【   】よりもむしろ畏敬の念が胸にあがった。*", opts:["慰藉","衷心","憐憫（憐愍）","忖度","断腸","顰蹙"], a:2},
  {id:344, q:"353 既定のスタイルからの差異を極大化しようとすれば、【   】物のファッションとならざるをえない。*", opts:["慰藉","衷心","憐憫（憐愍）","忖度","断腸","顰蹙"], a:5},

  {id:347, q:"356 【   】にあふれている数々の商品ですが、特に電気製品などは、昨今非常に小型化が進んできており…*", opts:["巷","埒","臨床","市井","前衛","版図"], a:0},

  {id:350, q:"359 そもそも統治し立法するためには、その統治・法が及ぶ【   】を「持って」いなければならない。*", opts:["巷","埒","臨床","市井","前衛","版図"], a:5},
  {id:351, q:"360 戯作性というものが…純文学の【  ="】外へ捨て去られた。*", opts:["巷","埒","臨床","市井","前衛","版図"], a:1},
  {id:352, q:"361 現在の大衆にはわかりにくい象徴的な【   】映画である。*", opts:["巷","埒","臨床","市井","前衛","版図"], a:4},

  {id:354, q:"363 アイスランドは、北人が新たにこの無人島に移住して、【   】政治的社会を建設するようになったのである。*", opts:["知己","彼我","漸次","瑕疵","嚆矢","多寡"], a:2},
  {id:355, q:"364 「自然」と「規範」とは異なる二つの概念であり、なんらかの量の【   】を同列に比較しうるようなものではない。*", opts:["知己","彼我","漸次","瑕疵","嚆矢","多寡"], a:5},
  {id:356, q:"365 人びとに欧米への開眼を迫った最大の要因は、【   】の軍事力の圧倒的な差と、それに根ざす危機感でした。*", opts:["知己","彼我","漸次","瑕疵","嚆矢","多寡"], a:1},

  {id:358, q:"367 「夫婦善哉」を書くまでは、一人の作家とも【   】がなかった。*", opts:["知己","彼我","漸次","瑕疵","嚆矢","多寡"], a:0},

  {id:360, q:"369 翻訳は【   】のように考えられ、文学を語る時にはこれまでまともに話題にされたことはなかった…*", opts:["醍醐味","野放図","不可逆","必要悪","不如意","不文律"], a:3},

let isRandom = false;
let currentList = [...rawData];
let currentIndex = 0;
let answered = false;

function init() {
  renderQuestion();
}

function toggleRandom() {
  isRandom = !isRandom;
  const btn = document.getElementById("randomBtn");
  const badge = document.getElementById("modeBadge");
  
  if (isRandom) {
    btn.innerText = "🔀 ランダム: ON";
    btn.style.background = "#2563eb";
    badge.innerText = "ランダム出題";
    // シャッフル
    currentList = [...rawData].sort(() => Math.random() - 0.5);
  } else {
    btn.innerText = "🔀 ランダム: OFF";
    btn.style.background = "#64748b";
    badge.innerText = "順序通りの出題";
    currentList = [...rawData];
  }
  currentIndex = 0;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const qData = currentList[currentIndex];
  
  document.getElementById("progressText").innerText = `問題 ${currentIndex + 1} / ${currentList.length}`;
  document.getElementById("questionText").innerText = qData.q;
  
  const optionsContainer = document.getElementById("optionsContainer");
  optionsContainer.innerHTML = "";
  
  qData.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = `${i + 1}. ${optText}`;
    btn.onclick = () => checkAnswer(i);
    optionsContainer.appendChild(btn);
  });
  
  const resultBox = document.getElementById("resultBox");
  resultBox.style.display = "none";
  resultBox.className = "result-box";
  document.getElementById("nextBtn").style.display = "none";
}

function checkAnswer(selectedIndex) {
  if (answered) return;
  answered = true;
  
  const qData = currentList[currentIndex];
  const buttons = document.querySelectorAll(".option-btn");
  const resultBox = document.getElementById("resultBox");
  
  buttons.forEach((btn, i) => {
    btn.onclick = null; // 無効化
    if (i === qData.a) {
      btn.classList.add("correct");
    } else if (i === selectedIndex) {
      btn.classList.add("wrong");
    }
  });
  
  if (selectedIndex === qData.a) {
    resultBox.innerText = "⭕ 正解！";
    resultBox.className = "result-box correct";
  } else {
    resultBox.innerText = `❌ 不正解... （正解: ${qData.a + 1}. ${qData.opts[qData.a]}）`;
    resultBox.className = "result-box wrong";
  }
  
  resultBox.style.display = "block";
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  if (currentIndex < currentList.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    alert("すべての問題を解答しました！最初に戻ります。");
    if (isRandom) {
      currentList = [...rawData].sort(() => Math.random() - 0.5);
    }
    currentIndex = 0;
    renderQuestion();
  }
}

init();
</script>

</body>
</html>
