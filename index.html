  let questions = [...originalQuestions];
  let currentIndex = 0;
  let answered = false;

  function loadQuestion() {
    answered = false;
    const q = questions[currentIndex];
    
    document.getElementById("progress").textContent = `問題 ${currentIndex + 1} / ${questions.length}`;
    document.getElementById("questionText").textContent = q.text;
    document.getElementById("resultMessage").textContent = "";

    const optionsGrid = document.getElementById("optionsGrid");
    optionsGrid.innerHTML = "";

    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(btn, opt, q.answer);
      optionsGrid.appendChild(btn);
    });

    document.getElementById("prevBtn").disabled = currentIndex === 0;
    document.getElementById("nextBtn").disabled = currentIndex === questions.length - 1;
  }

  function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
    if (answered) return;
    answered = true;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correctOpt) {
        btn.classList.add("correct");
      }
    });

    const result = document.getElementById("resultMessage");
    if (selectedOpt === correctOpt) {
      result.textContent = "⭕️ 正解！";
      result.style.color = "#28a745";
    } else {
      selectedBtn.classList.add("wrong");
      result.textContent = `❌ 不正解... （正解: ${correctOpt}）`;
      result.style.color = "#dc3545";
    }
  }

  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      loadQuestion();
    }
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      loadQuestion();
    }
  }

  function shuffleQuestions() {
    for (let i = questions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [questions[i], questions[j]] = [questions[j], questions[i]];
    }
    currentIndex = 0;
    loadQuestion();
  }

  // 初期ロード
  loadQuestion();
</script>
