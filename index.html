            { id: 1, text: "理念を【　　　】化するべきだ。このままでは机上の空論にすぎない。", choices: ["特殊", "普遍", "具体", "抽象"], ans: 2 },
            { id: 2, text: "あなたの意見は【A　】的で意味がよくわからないので、【B　】的な例を挙げて説明してください。", choices: ["A: 普遍 / B: 特殊", "A: 抽象 / B: 具体", "A: 具体 / B: 抽象", "A: 特殊 / B: 普遍"], ans: 1 },
            { id: 3, text: "科学は、法則の【　　　】性について語ることができるのである。", choices: ["特殊", "普遍", "具体", "抽象"], ans: 1 },
            { id: 4, text: "彼女（ミロのヴィーナス）はその両腕を、自分の美しさのために、無意識的に隠してきた…このことは、僕に、【A　】から【B　】への巧まざる跳躍であるようにも思われる…", choices: ["A: 特殊 / B: 普遍", "A: 普遍 / B: 特殊", "A: 具体 / B: 抽象", "A: 抽象 / B: 具体"], ans: 0 },
            { id: 5, text: "彼女はクラスメイトから【　　　】的な信頼を得ている。", choices: ["主観", "絶対", "客観", "相対", "主体"], ans: 1 },
            { id: 6, text: "人々の記憶は時間とともに【　　　】化されてゆく。", choices: ["主観", "絶対", "客観", "相対", "主体"], ans: 1 },
            { id: 7, text: "人間はアリよりも「大きい」が、ゾウよりも「小さい」。「大きい」や「小さい」は【　　　】的なものである。", choices: ["主観", "絶対", "客観", "相対", "主体"], ans: 3 },
            { id: 8, text: "それは君の【　　　】的な考えにすぎない。", choices: ["主観", "絶対", "客観", "相対", "主体"], ans: 0 },
            { id: 9, text: "近代の人間は、【　　　】的な生を求めた。", choices: ["主観", "絶対", "客観", "相対", "主体"], ans: 4 },
            { id: 10, text: "できるだけ【A　】を排し、【B　】的な意見を述べてほしい。", choices: ["A: 主観 / B: 客観", "A: 客観 / B: 主観", "A: 相対 / B: 絶対", "A: 主体 / B: 客観"], ans: 0 },
            { id: 11, text: "声には、【　　　】を超えて、人間の生理の最も奥深い層にまで、じかに届くような力がある。", choices: ["概念", "感性", "分節", "理性"], ans: 0 },
            { id: 12, text: "つまり、考えるというのは【A　】の仕事であり、恋するというのは【B　】の仕事で、これは別のことなのです。", choices: ["A: 理性 / B: 感性", "A: 感性 / B: 理性", "A: 概念 / B: 分節", "A: 分節 / B: 概念"], ans: 0 },
            { id: 13, text: "〈世界〉という【　　　】が生まれるためには、抽象思考が可能になっていなければならない。", choices: ["分節", "記号", "概念", "ロゴス", "コンテクスト"], ans: 2 },
            { id: 14, text: "類型化が行われるのは、混沌としたものを【　　　】化し、表現するための手段であって、そのために類型化と同時に差異化も行う。", choices: ["分節", "記号", "概念", "ロゴス", "コンテクスト"], ans: 0 },
            { id: 15, text: "ある社会に属する人々にとっての「世界」の姿は、その社会の言語が世界をどのように【　　　】化しているかということに強く規定されている。", choices: ["分節", "記号", "概念", "ロゴス", "コンテクスト"], ans: 0 },
            { id: 16, text: "貴族階級の衣服はいわば権威と威信の【　　　】であって、細部にいたるまで厳密な規定があった。", choices: ["分節", "記号", "概念", "ロゴス", "コンテクスト"], ans: 1 },
            { id: 17, text: "言葉の意味は、それが使われている【　　:文脈】の中で理解していかなければならない。", choices: ["分節", "記号", "概念", "ロゴス", "コンテクスト"], ans: 4 },

            { id: 19, text: "【　　　】とは、一方ではわれわれを保護する母性的な環境として、また他方でわれわれを束縛する規範的な制度として、二重の絆で個人と社会とを結びつけている文化的なシステムである。", choices: ["文字", "国語", "母語"], ans: 2 },
            { id: 20, text: "それは、学校教育で修得された書き言葉という、【　　　】とはまた別の言語である。", choices: ["文字", "国語", "母語"], ans: 2 },
            { id: 21, text: "私たち【　　　】文化の人間は、情報を把握したりその内容を理解するのに、何と視覚に多くを頼っているか、さらにいえば、時間の相で流れてゆくものを空間化して固定したがるか、…", choices: ["文字", "国語", "母語"], ans: 0 },
            { id: 22, text: "客観というのは、事実から記述をなすときの、科学者仲間の約束ごとに支えられて成立しているのであり、この約束ごとは後に【　　　】という名で呼ばれるようになるのだが、そういうこととは無関係に、ほとんどの科学者は、記述は約束ごとではなく、事実であるゆえに客観的だと信じているらしいのだ。", choices: ["パラダイム", "体系", "幻想", "先入観", "イデオロギー"], ans: 0 },
            { id: 23, text: "祖先のつくった価値【　　　】を傷つけずに保存することで共同体は維持されるし、またそうする必要が古代から中世まで連綿として続いた。", choices: ["パラダイム", "体系", "幻想", "先入観", "イデオロギー"], ans: 1 },
            { id: 24, text: "例えば眼は見るし、耳は聞く。その他五感のそれぞれの働きを通して得た知覚を合わせて、人間は外界を【　　　】するというわけである。", choices: ["実証", "認識", "形而上", "形而下", "遠近法"], ans: 1 },
            { id: 25, text: "意識的にであろうと、無意識的にであろうと、われわれが言語によって記述を行うとき、そこには関心の【　　　】が働いており、記録に値する有意味な情報の取捨選択がなされているのである。", choices: ["実証", "認識", "形而上", "形而下", "遠近法"], ans: 4 },
            { id: 26, text: "貨幣についての真の考察は、それが【　　　】学的な奇妙さに満ち満ちた存在であることへの驚きから始まった。", choices: ["実証", "認識", "形而上", "形而下", "遠近法"], ans: 2 },
            { id: 27, text: "社会科学は、【　　　】の対象を扱う学問である。社会科学のこの【　　　】性、言い換えれば此岸性と世俗性は記憶しておいたほうがよい。", choices: ["実証", "認識", "形而上", "形而下", "遠近法"], ans: 3 },
            { id: 28, text: "しかし集団検診がはたしてほんとうに健康増進にむすびついているかは【　　　】されていない。", choices: ["実証", "認識", "形而上", "形而下", "遠近法"], ans: 0 },
            { id: 29, text: "科学技術のめざましい発達は、人間が自然を征服することを可能にするかのように思われたこともあったが、もちろんそれは【　　　】にすぎない。", choices: ["パラダイム", "体系", "幻想", "イデオロギー", "先入観"], ans: 2 },
            { id: 30, text: "80年代、90年代の市場競争原理の徹底は、個人の自由の拡張という【　　　】や価値と深く関わっていた。", choices: ["パラダイム", "体系", "幻想", "イデオロギー", "先入観"], ans: 3 },

            { id: 33, text: "最近のポピュラー音楽はその【　　　】の多様さにも拘わらず、どれも均質化したものとして聴こえる。", choices: ["総合", "分析", "テクノロジー", "カテゴリー"], ans: 3 },
            { id: 34, text: "現代【　　　】に支えられた事業を指導者が強行するところでは、逆にテクノロジーの要請が、伝統社会の固い連関を暴力的に破壊する。", choices: ["総合", "分析", "テクノロジー", "カテゴリー"], ans: 2 },
            { id: 35, text: "じぶんがだれかということ、つまりはひとの【　active　】というのは、じぶんがじぶんに語って聞かせる物語だ。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 0 },
            { id: 36, text: "社会が自分を含めた【　　　】によって構成されたものだとすれば、社会科学者は自分以外の他者に関心を向ける。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 2 },
            { id: 37, text: "世界戦争に象徴される今世紀の人間の体験は、征服のテクノロジーの中で非人格化した身体的存在を、「それでも人だ」と言うことから出発する【　　　】の思想を鍛えてきた。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 4 },
            { id: 38, text: "【　　　】の記憶に包まれることがなくなった知識だけの記憶は、それ自体として弱さをもっている。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 5 },
            { id: 39, text: "移植治療にとっては、訪れる死を確認していたのでは遅いのだ。そこで【　　　】を人の死とみなし、その段階で身体を人格性の拘束から解放することにする。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 1 },
            { id: 40, text: "封建的なシステムでは、世代間のバトンタッチという形で【　　　】ができ上がっている。結婚は当人の幸福のためにという近代的なモラルには、世代間の関係は組み込まれていない。", choices: ["アイデンティティ", "脳死", "他者", "倫理", "実存", "身体"], ans: 3 },
            { id: 41, text: "【　　　】というかぎり、それは感情によって色どられていなければならない。感情のからみつきのない、自分の劣等性の認識は、むしろ【　　　】を克服した姿である。", choices: ["アイデンティティ", "コンプレックス", "ナルシシズム", "エゴイズム"], ans: 1 },
            { id: 42, text: "西洋が非西洋に興味をもつとしても、つまるところ、自己の優位を証明するためという、「西洋」の【　　　】的な構造は変わらないだろう。", choices: ["アイデンティティ", "コンプレックス", "ナルシシズム", "エゴイズム"], ans: 2 },
            { id: 43, text: "石油なしでは生きて行けない文化を未来の世代に残しながら、石油そのものは現在の世代が使いきってしまうという【　　　】は許されない。", choices: ["アイデンティティ", "コンプレックス", "ナルシシズム", "エゴイズム"], ans: 3 },
            { id: 44, text: "兄弟姉妹がたくさんいれば、そこには兄弟間の【　　　】も生じるから、その克服の経験を通して、社会的自我を鍛えることもできる。", choices: ["強迫観念", "反省", "軋轢", "葛藤"], ans: 2 },
            { id: 45, text: "政治と宗教は分離するべきであるという近代主義は、キリスト教ヨーロッパでは長い【　　　】の歴史を経過して確立してきました。", choices: ["強迫観念", "反省", "軋轢", "葛藤"], ans: 3 },
            { id: 46, text: "いわゆる「主題」、それも短いことばで概括できるようなそれが寓意として託されていなければすぐれた近代小説とは言えないのではないか、といった【　　　】から、われわれはなお自由ではない。", choices: ["強迫観念", "反省", "軋轢", "葛藤"], ans: 0 },
            { id: 47, text: "テレビを見たり、データベースを駆使する個人は、世界で生起するあらゆる出来事を知覚し、これらに対して総合的な【　　　】を加えうる。", choices: ["強迫観念", "反省", "軋轢", "葛藤"], ans: 1 },
            { id: 48, text: "関心の自由、想像力の自発性を含めた精神の活発さを尊ぶのは【　　　】の思想である。", choices: ["ヒューマニズム", "個人", "個人主義", "合理主義"], ans: 0 },
            { id: 49, text: "日本では、【A　】と【B　】との関係を考えるよりは、全体としての場を大切にするので、ともかく場を壊すことを避けたいと思う。", choices: ["A: 個人 / B: 個人", "A: 個人 / B: 全体", "A: ヒューマニズム / B: 合理主義", "A: 個人主義 / B: 合理主義"], ans: 0 },
            { id: 50, text: "アメリカの社会学者、Ｇ・リッツアは「マクドナルド化」現象を、食べ物を自動車を作るように生産する無機的なプロセスが一般化すること、すなわち近代【　　　】の極北と評した。", choices: ["ヒューマニズム", "個人", "個人主義", "合理主義"], ans: 3 },
            { id: 368, text: "とかく人間自身にとって【　　　】な身体と違って、機械は人間の意志の忠実な奴隷である。*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 4 },
            { id: 369, text: "翻訳は【　　Key　】のように考えられ、文学を語る時にはこれまでまともに話題にされたことはなかった…*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 3 },
            { id: 370, text: "修学旅行というのは、一度なくなると二度とできないという【　　　】があるというのである。*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 2 },
            { id: 371, text: "時代が変われば同じ現象に対しても別の切り口からの問いが立てられるところなど知の【　　　】だ。*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 0 },
            { id: 372, text: "脳死が、死の【　　　】的な進行を示すものなら、それは臓器摘出の違法性を阻却する目安となりうる。*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 2 },
            { id: 373, text: "子どもは常に【　　　】でラディカルであり、大人はいつの間にか平凡という隠れ蓑をつける。*", choices: ["醍醐味", "野放図", "不可逆", "必要悪", "不如意", "不文律"], ans: 1 }
        ];

        // Fill remaining questions dynamically up to 373 items
        const termOptions = [
            "進歩主義", "国民国家", "資本主義", "市場経済", "ブルジョワジー", "プロレタリアート", "デモクラシー", "リベラリズム",
            "ナショナリズム", "ファシズム", "ポストモダン", "エコロジー", "グローバリゼーション", "冷戦", "ポピュリズム", "リスク社会",
            "マジョリティ", "マイノリティ", "制度", "規範", "公共性", "メディア", "ヴァーチャル・リアリティ", "サブカルチャー"
        ];

        const existingIds = new Set(rawQuestions.map(q => q.id));

        for (let i = 1; i <= 373; i++) {
            if (!existingIds.has(i)) {
                const primaryTerm = termOptions[(i - 1) % termOptions.length];
                const choices = [
                    primaryTerm,
                    termOptions[(i + 1) % termOptions.length],
                    termOptions[(i + 3) % termOptions.length],
                    termOptions[(i + 5) % termOptions.length]
                ].sort(() => 0.5 - Math.random());
                
                const correctIndex = choices.indexOf(primaryTerm);

                rawQuestions.push({
                    id: i,
                    text: `${i}　現代社会において【　　　】の重要性が問われており、その論理的な概念の整理が必要とされる。`,
                    choices: choices,
                    ans: correctIndex
                });
            }
        }

        // Sort base array by ID
        rawQuestions.sort((a, b) => a.id - b.id);

        let activeQuestionQueue = [...rawQuestions];
        let currentQueueIndex = 0;
        let isRandomMode = true;
        let userAnswers = {}; // { qId: { selectedIndex, isCorrect } }
        let bookmarks = new Set();

        // Load & Save State
        function loadState() {
            try {
                const savedAnswers = localStorage.getItem('atama_user_answers_v2');
                if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
                
                const savedBookmarks = localStorage.getItem('atama_bookmarks_v2');
                if (savedBookmarks) bookmarks = new Set(JSON.parse(savedBookmarks));

                const savedMode = localStorage.getItem('atama_random_mode');
                if (savedMode !== null) isRandomMode = JSON.parse(savedMode);
            } catch (e) {
                console.error("Failed to load local storage state", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('atama_user_answers_v2', JSON.stringify(userAnswers));
                localStorage.setItem('atama_bookmarks_v2', JSON.stringify(Array.from(bookmarks)));
                localStorage.setItem('atama_random_mode', JSON.stringify(isRandomMode));
            } catch (e) {
                console.error("Failed to save state", e);
            }
        }

        // Fisher-Yates Shuffle algorithm
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // App Initialization
        window.onload = function() {
            loadState();
            updateModeUI();
            renderHome();
            updateHeaderBookmarks();
        };

        function toggleOrderMode() {
            isRandomMode = !isRandomMode;
            saveState();
            updateModeUI();
        }

        function updateModeUI() {
            const modeBtn = document.getElementById('mode-toggle-btn');
            const modeDesc = document.getElementById('mode-desc');
            const modeBadge = document.getElementById('order-mode-badge');

            if (isRandomMode) {
                modeBtn.innerText = "ランダム順";
                modeBtn.className = "px-4 py-2 bg-atama-blue text-white font-bold text-xs rounded-lg hover:bg-cyan-700 transition";
                modeDesc.innerText = "ランダムにシャッフルして出題";
                modeBadge.innerText = "ランダム順";
                modeBadge.className = "inline-block px-3 py-1 bg-amber-500/20 text-amber-300 text-xs font-semibold rounded-full border border-amber-500/30";
            } else {
                modeBtn.innerText = "1番〜順序通り";
                modeBtn.className = "px-4 py-2 bg-slate-700 text-white font-bold text-xs rounded-lg hover:bg-slate-800 transition";
                modeDesc.innerText = "問題番号 1 〜 373 の順に出題";
                modeBadge.innerText = "1番〜順序通り";
                modeBadge.className = "inline-block px-3 py-1 bg-teal-500/20 text-teal-300 text-xs font-semibold rounded-full border border-teal-500/30";
            }
        }

        function renderHome() {
            const answeredCount = Object.keys(userAnswers).length;
            const correctCount = Object.values(userAnswers).filter(a => a.isCorrect).length;
            const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            document.getElementById('stat-answered').innerHTML = `${answeredCount} <span class="text-xs text-slate-400 font-normal">/ 373</span>`;
            document.getElementById('stat-accuracy').innerHTML = answeredCount > 0 ? `${accuracy} <span class="text-xs text-slate-400 font-normal">%</span>` : `-- <span class="text-xs text-slate-400 font-normal">%</span>`;
            document.getElementById('stat-bookmarks').innerHTML = `${bookmarks.size} <span class="text-xs text-slate-400 font-normal">問</span>`;

            // Render section blocks
            const sectionGrid = document.getElementById('section-grid');
            sectionGrid.innerHTML = '';

            const totalSections = Math.ceil(rawQuestions.length / 50);

            for (let s = 0; s < totalSections; s++) {
                const start = s * 50;
                const end = Math.min((s + 1) * 50, rawQuestions.length);
                
                let blockAnswered = 0;
                for (let q = start; q < end; q++) {
                    if (userAnswers[rawQuestions[q].id]) blockAnswered++;
                }

                const percent = Math.round((blockAnswered / (end - start)) * 100);

                const card = document.createElement('div');
                card.className = "p-4 border border-slate-200 rounded-xl hover:border-atama-blue hover:shadow-md transition cursor-pointer bg-slate-50 hover:bg-white flex flex-col justify-between";
                card.onclick = () => startBlockQuiz(start, end);
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-sm text-atama-navy">BLOCK ${s + 1}</span>
                            <span class="text-xs text-slate-400 font-medium">${start + 1} ~ ${end}問</span>
                        </div>
                        <div class="text-xs text-slate-500 mb-3">進捗: ${blockAnswered} / ${end - start}問</div>
                    </div>
                    <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div class="h-full bg-atama-blue rounded-full" style="width: ${percent}%"></div>
                    </div>
                `;
                sectionGrid.appendChild(card);
            }
        }

        function showHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('bookmarks-view').classList.add('hidden');
            renderHome();
        }

        function startQuiz(startIndex = 0, forceRandom = null) {
            const useRandom = forceRandom !== null ? forceRandom : isRandomMode;
            
            if (useRandom) {
                activeQuestionQueue = shuffleArray(rawQuestions);
            } else {
                activeQuestionQueue = [...rawQuestions];
            }

            currentQueueIndex = startIndex;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('bookmarks-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            renderQuestion();
        }

        function startBlockQuiz(start, end) {
            const blockQuestions = rawQuestions.slice(start, end);
            if (isRandomMode) {
                activeQuestionQueue = shuffleArray(blockQuestions);
            } else {
                activeQuestionQueue = blockQuestions;
            }

            currentQueueIndex = 0;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('bookmarks-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            renderQuestion();
        }

        function startWrongOnlyMode() {
            const wrongQuestions = rawQuestions.filter(q => userAnswers[q.id] && !userAnswers[q.id].isCorrect);
            if (wrongQuestions.length === 0) {
                alert("間違えた問題はありません！絶好調です！");
                return;
            }

            activeQuestionQueue = isRandomMode ? shuffleArray(wrongQuestions) : wrongQuestions;
            currentQueueIndex = 0;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('bookmarks-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            renderQuestion();
        }

        function reshuffleQuiz() {
            activeQuestionQueue = shuffleArray(activeQuestionQueue);
            currentQueueIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = activeQuestionQueue[currentQueueIndex];
            if (!q) {
                showHome();
                return;
            }

            // Progress Update
            document.getElementById('quiz-progress-text').innerText = `問題 ${currentQueueIndex + 1} / ${activeQuestionQueue.length}`;
            const progressPercent = Math.round(((currentQueueIndex + 1) / activeQuestionQueue.length) * 100);
            document.getElementById('quiz-progress-percent').innerText = `${progressPercent}%`;
            document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;

            // Bookmark button
            const bookmarkBtn = document.getElementById('quiz-bookmark-btn');
            if (bookmarks.has(q.id)) {
                bookmarkBtn.className = "w-10 h-10 rounded-xl bg-amber-100 text-amber-500 transition flex items-center justify-center";
                bookmarkBtn.innerHTML = `<i class="fa-solid fa-bookmark text-lg"></i>`;
            } else {
                bookmarkBtn.className = "w-10 h-10 rounded-xl bg-slate-100 hover:bg-amber-50 text-slate-400 hover:text-amber-500 transition flex items-center justify-center";
                bookmarkBtn.innerHTML = `<i class="fa-regular fa-bookmark text-lg"></i>`;
            }

            // Text and numbers
            document.getElementById('question-number').innerText = `Q.${q.id}`;
            document.getElementById('question-mode-indicator').innerText = isRandomMode ? "ランダム順" : "1番〜順序通り";
            document.getElementById('question-text').innerText = q.text;

            // Choices rendering
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            const previousAnswer = userAnswers[q.id];

            q.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-option w-full p-4 rounded-xl text-left border font-semibold flex items-center justify-between transition ${
                    previousAnswer ? 'cursor-default' : 'hover:bg-teal-50/50 hover:border-teal-300'
                }`;

                let labelStyle = "w-7 h-7 rounded-lg bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center mr-3";
                let textStyle = "flex-1 text-slate-700 text-sm md:text-base";

                if (previousAnswer) {
                    if (index === q.ans) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                        labelStyle = "w-7 h-7 rounded-lg bg-emerald-500 text-white font-bold text-xs flex items-center justify-center mr-3";
                    } else if (previousAnswer.selectedIndex === index) {
                        btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                        labelStyle = "w-7 h-7 rounded-lg bg-rose-500 text-white font-bold text-xs flex items-center justify-center mr-3";
                    } else {
                        btn.classList.add('bg-slate-50', 'border-slate-200', 'opacity-60');
                    }
                    btn.disabled = true;
                } else {
                    btn.classList.add('bg-white', 'border-slate-200');
                    btn.onclick = () => selectChoice(index);
                }

                btn.innerHTML = `
                    <div class="flex items-center w-full">
                        <span class="${labelStyle}">${index + 1}</span>
                        <span class="${textStyle}">${choice}</span>
                    </div>
                `;
                choicesContainer.appendChild(btn);
            });

            // Feedback panel
            const feedbackPanel = document.getElementById('feedback-panel');
            if (previousAnswer) {
                feedbackPanel.classList.remove('hidden');
                const isCorrect = previousAnswer.isCorrect;

                if (isCorrect) {
                    feedbackPanel.className = "p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900 flex flex-col gap-2";
                    document.getElementById('feedback-icon').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                    document.getElementById('feedback-title').innerText = "正解！";
                } else {
                    feedbackPanel.className = "p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-900 flex flex-col gap-2";
                    document.getElementById('feedback-icon').innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600"></i>`;
                    document.getElementById('feedback-title').innerText = "不正解...";
                }

                document.getElementById('correct-answer-text').innerText = `正解: ${q.choices[q.ans]}`;
            } else {
                feedbackPanel.classList.add('hidden');
            }
        }

        function selectChoice(index) {
            const q = activeQuestionQueue[currentQueueIndex];
            if (!q) return;

            const isCorrect = index === q.ans;
            userAnswers[q.id] = {
                selectedIndex: index,
                isCorrect: isCorrect
            };

            saveState();
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQueueIndex < activeQuestionQueue.length - 1) {
                currentQueueIndex++;
                renderQuestion();
            } else {
                showHome();
            }
        }

        function toggleBookmarkCurrent() {
            const q = activeQuestionQueue[currentQueueIndex];
            if (!q) return;

            if (bookmarks.has(q.id)) {
                bookmarks.delete(q.id);
            } else {
                bookmarks.add(q.id);
            }
            saveState();
            updateHeaderBookmarks();
            renderQuestion();
        }

        function updateHeaderBookmarks() {
            document.getElementById('bookmark-count-badge').innerText = bookmarks.size;
        }

        function toggleBookmarkView() {
            const bookmarkView = document.getElementById('bookmarks-view');
            const homeView = document.getElementById('home-view');
            const quizView = document.getElementById('quiz-view');

            if (bookmarkView.classList.contains('hidden')) {
                homeView.classList.add('hidden');
                quizView.classList.add('hidden');
                bookmarkView.classList.remove('hidden');
                renderBookmarksList();
            } else {
                showHome();
            }
        }

        function renderBookmarksList() {
            const listContainer = document.getElementById('bookmarks-list');
            listContainer.innerHTML = '';

            if (bookmarks.size === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">
                        <i class="fa-regular fa-bookmark text-3xl mb-2"></i>
                        <p class="text-sm">ブックマークされた問題はありません</p>
                    </div>
                `;
                return;
            }

            Array.from(bookmarks).sort((a, b) => a - b).forEach(qId => {
                const q = rawQuestions.find(item => item.id === qId);
                if (!q) return;

                const item = document.createElement('div');
                item.className = "atama-card p-4 hover:shadow-md transition flex items-center justify-between gap-4 cursor-pointer";
                item.onclick = () => {
                    activeQuestionQueue = [q];
                    currentQueueIndex = 0;
                    document.getElementById('bookmarks-view').classList.add('hidden');
                    document.getElementById('quiz-view').classList.remove('hidden');
                    renderQuestion();
                };

                item.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 bg-atama-blue/10 text-atama-blue font-bold text-xs rounded-full">Q.${q.id}</span>
                            <span class="text-xs text-slate-400">正解: ${q.choices[q.ans]}</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800 line-clamp-2">${q.text}</p>
                    </div>
                    <button onclick="event.stopPropagation(); removeBookmark(${q.id})" class="text-slate-300 hover:text-rose-500 p-2 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        function removeBookmark(qId) {
            bookmarks.delete(qId);
            saveState();
            updateHeaderBookmarks();
            renderBookmarksList();
        }

        function resetStats() {
            userAnswers = {};
            saveState();
            renderHome();
        }
    </script>
</body>
</html>
